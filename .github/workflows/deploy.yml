name: Deploy Backend to VPS

on:
  push:
    branches:
      - production
      - dev
  pull_request:
    branches:
      - production
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test

  deploy:
    name: Deploy to VPS
    needs: test
    if: (github.event_name == 'push' && (github.ref_name == 'production' || github.ref_name == 'dev')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Set environment target
        id: env_spec
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "app_dir=${{ secrets.PROD_APP_DIR }}" >> $GITHUB_OUTPUT
            echo "pm2_name=mokushi-backend" >> $GITHUB_OUTPUT
          else
            echo "app_dir=${{ secrets.DEV_APP_DIR }}" >> $GITHUB_OUTPUT
            echo "pm2_name=mokushi-backend-dev" >> $GITHUB_OUTPUT
          fi

      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ steps.env_spec.outputs.app_dir }}
            git pull origin ${{ github.ref_name }}
            npm install
            npx prisma generate
            npx prisma migrate deploy || true
            npm run build
            PM2_NAME="${{ steps.env_spec.outputs.pm2_name }}" pm2 restart ${{ steps.env_spec.outputs.pm2_name }} --update-env || PM2_NAME="${{ steps.env_spec.outputs.pm2_name }}" pm2 start ecosystem.config.js --name "${{ steps.env_spec.outputs.pm2_name }}"
